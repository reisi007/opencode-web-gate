# Portainer-Stack: code-remote — ZWEITER Weg neben Mac-Tunnel (CODE_DOMAIN bleibt).
# Deploy: Portainer -> Stacks -> Add stack `code-remote` -> Web editor -> diese Datei pasten.
# Isolation: code-dev + dind + code-auth-remote haengen NUR in `code-remote`.
# KEIN webnet hier -> kein Zugriff auf Prod-Container per Name. Internet geht via NAT.
# Caddy braucht zusaetzlich das Netz `code-remote` (siehe remote/README.md, caddyfile-Repo).
#
# Env in Portainer (oder Stack-Env):
#   OPENCODE_PASSWORD   Pflicht (Serverpasswort, Caddy injiziert es upstream, Browser sieht es nie)
#   OPENCODE_AUTOUPDATE   default true: holt beim Containerstart das neueste
#                         opencode-Binary (V2 releast teils mehrmals taeglich);
#                         mit false deaktivieren (Image-Stand + CI-Updates only)
#   OPENCODE_UPDATE_INTERVAL default 1200: Watcher-Pruefintervall in Sekunden
#                         (1200 = 3x/Stunde, 1800 = 2x/Stunde, Minimum 300)
#   OPENCODE_UPDATE_HOURS default 5-21: Tagesfenster in Containerzeit (UTC,
#                         5-21 UTC ~= 06-22 MEZ Wien); "" = rund um die Uhr
#   OPENCODE_UPDATE_RESTART default idle: Container-Neustart bei Update nur
#                         wenn keine Session aktiv ist (busy → vertagt);
#                         mit always immer neustarten (kann Runs abbrechen)
#   AUTH_USER           default admin
#   AUTH_HASH           Pflicht (bcrypt $2a$... 60 Zeichen ODER pbkdf2$... vom setup.sh)
#   AUTH_SECRET         Pflicht (64 Hex, openssl rand -hex 32)
#   SESSION_TTL         default 43200
#   IMAGE               default ghcr.io/reisi007/opencode-web-dev-baseline:latest
#   CPU_CORES           default 3: maximale CPU-Kerne fuer code-dev
#   MEMORY_LIMIT        default 2g: RAM-Limit fuer code-dev
#   MEMSWAP_LIMIT       default 5g: RAM+Swap GESAMT fuer code-dev (3 GB Swap).
#                         MUSS groesser sein als MEMORY_LIMIT, weil Docker
#                         memory.swap.max = MEMSWAP_LIMIT - MEMORY_LIMIT setzt.
#                         Ohne diesen Wert ist der Swap-Deckel exakt
#                         MEMORY_LIMIT. Details und Messwerte: README,
#                         Abschnitt "RAM- und Swap-Limits".
#   DIND_MEMORY_LIMIT   default 1300m: RAM-Limit fuer den dind-Daemon
#   DIND_MEMSWAP_LIMIT  default 3g: RAM+Swap gesamt fuer den dind-Daemon
#                         (1,7 GB Swap fuer Builds im Daemon)
#   DIND_CPU_CORES      default 2: CPU-Quota fuer den dind-Daemon
#
# KEIN HOST_GATEWAY / extra_hosts mehr (entfernt 2026-09-26, siehe
# remote/README.md Abschnitt "Warum es kein extra_hosts gibt").
# Kurzfassung: `extra_hosts: host-gateway` hat localhost nie repariert —
# 127.0.0.1 ist im Container immer der Container. Es hat nur eine Tuer zum
# VPS-Host geoeffnet (Portainer-UI auf 8000/9443 war live erreichbar), und
# `host.docker.internal` wurde nachweislich nirgends benutzt.
#
# Erster Login danach: docker exec -it code-dev gh auth login
# (gespeichert in Volume gh-config -> ueberlebt Image-Upgrades)
services:
  code-dev:
    image: ${IMAGE:-ghcr.io/reisi007/opencode-web-dev-baseline:latest}
    container_name: code-dev
    restart: unless-stopped
    cpus: ${CPU_CORES:-3}
    # RAM-Deckel und Swap-Deckel getrennt setzen.
    #
    # cgroup-v2-Semantik, live auf dem VPS gemessen (Direkt-Reads aus
    # /sys/fs/cgroup/.../memory.max und memory.swap.max):
    #     memory.max      = mem_limit        (RAM-Deckel)
    #     memory.swap.max = memswap_limit - mem_limit   (REINER Swap-Deckel)
    #   --memory 200m                      -> max 200m, swap.max  200m (gesamt  400m)
    #   --memory 200m --memory-swap  800m  -> max 200m, swap.max  600m (gesamt  800m)
    #   --memory 200m --memory-swap 1600m  -> max 200m, swap.max 1400m (gesamt 1600m)
    #
    # WICHTIG, es wurde hier zuerst das Gegenteil behauptet und es war FALSCH:
    # ohne memswap_limit ist Swap NICHT deaktiviert und auch nicht unbegrenzt,
    # sondern der Deckel ist exakt mem_limit. Vorher stand hier 4g/4g, und
    # code-dev hat nachweislich 385 MB Swap benutzt (memory.swap.current).
    # memswap_limit setzt man, um das VERHaelTNIS zu bestimmen und den
    # Gesamt-Fussabd (RAM+Swap) hart zu deckeln — nicht um Swap zu eroeffnen.
    #
    # 2g RAM + 3g Swap = 5g gesamt. Bei 1,4 GB anon realem Bedarf ist 2g RAM
    # knapp, der Swap fängt Spitzen ab, statt Caddy/MariaDB zu verdrängen.
    mem_limit: ${MEMORY_LIMIT:-2g}
    memswap_limit: ${MEMSWAP_LIMIT:-5g}
    environment:
      # OPENCODE_PASSWORD ist der aktuelle Name; OPENCODE_SERVER_PASSWORD bleibt
      # als Legacy-Fallback für Entrypoint/Caddy und ältere OpenCode-Versionen.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_AUTOUPDATE=${OPENCODE_AUTOUPDATE:-true}
      - OPENCODE_UPDATE_INTERVAL=${OPENCODE_UPDATE_INTERVAL:-1200}
      - OPENCODE_UPDATE_HOURS=${OPENCODE_UPDATE_HOURS:-5-21}
      - OPENCODE_UPDATE_RESTART=${OPENCODE_UPDATE_RESTART:-idle}
      - DOCKER_HOST=tcp://dind:2375
      - PORT=8080
    # Bewusst KEIN extra_hosts: 127.0.0.1 ist im Container der Container,
    # nicht der VPS. host-gateway loest dieses Problem nicht, es oeffnet
    # nur den Host. Ein Dev-Server (z. B. `pnpm dev`) laeuft direkt in
    # code-dev und ist damit ueber 127.0.0.1 erreichbar — ganz ohne Docker.
    # Details und die Alternativen: remote/README.md
    volumes:
      - code-remote-projects:/projects
      - gh-config:/home/dev/.config/gh
      - gh-ssh:/home/dev/.ssh
      - opencode-data:/home/dev/.local/share/opencode
      - opencode-config:/home/dev/.config/opencode
      - opencode-state:/home/dev/.local/state/opencode
    networks:
      - code-remote
    depends_on:
      dind:
        condition: service_started
      code-auth-remote:
        condition: service_started

  # Isolierter Docker-Daemon NUR fuer code-dev (eigener Image-Cache, sieht Host/Prod nicht).
  #
  # ROOTLESS statt privileged (2026-09-26). Vorher: privileged: true, das ergab
  # CapEff 000001ffffffffff (alle 37 Capabilities) und /dev/vda4 war sichtbar —
  # also faktisch Root auf dem Host, auf dem /home/webadmin/websites, die
  # MariaDB-Volumes, die TLS-Keys, portainer.db und die rclone-Config liegen.
  # Da code-dev die Docker-CLI hat und DOCKER_HOST auf diesen Daemon zeigt,
  # war das der direkte Weg aus dem Dev-Container in die Prod-Daten.
  #
  # Rootless laeuft in einem User-Namespace: gleiche Funktionalitaet, aber
  # der Daemon selbst hat keine Host-Pfade. Live verifiziert:
  #   CapEff                     0000000000000000   (null Capabilities)
  #   Host-Blockdevices (/dev/vda*)  []                (nicht vorhanden)
  #   SecurityOptions            seccomp, rootless, cgroupns
  #   Build / docker compose     funktionieren
  #   Host 9443                  nicht erreichbar
  dind:
    image: docker:29-dind-rootless
    container_name: code-remote-dind
    restart: unless-stopped
    # Limit fuer ALLE Container, die der Agent in diesem Daemon startet:
    # die inneren Prozesse teilen sich denselben cgroup wie der Daemon
    # (live gemessen: /system.slice/docker-<id>.scope fuer beide), ein
    # Limit am Daemon-Container schlaegt also auf innere Container durch.
    # Verifiziert mit 1,8 GB tmpfs in einem inneren Container bei mem_limit 600m:
    #   memory.peak   629149696  (genau die Decke)
    #   oom_kill       1
    # Also ja, das Limit greift. Der OOM-Killer trifft dabei aber den
    # GROESSTEN Prozess im cgroup — das ist der dind-Daemon, nicht der
    # schuldige Container. Deshalb ein eigenes Limit fuer den DinD statt
    # eines gemeinsamen mit code-dev: so stirbt bei einem runaway Build
    # nur code-remote-dind (restart: unless-stopped, startet neu), waehrend
    # die code-dev-Session weiterlaeuft.
    cpus: ${DIND_CPU_CORES:-2}
    # 1300m RAM + 1772m Swap = 3g gesamt. Da memswap_limit = 3g gesamt ist,
    # setzt Docker memory.swap.max auf 3g - 1300m. RAM knapper, Swap grosszuegiger
    # als bei code-dev: Builds im Daemon sind Batch-Arbeit, die Latenz des
    # Daemons ist egal, code-dev ist interaktiv und darf nicht swappen.
    mem_limit: ${DIND_MEMORY_LIMIT:-1300m}
    memswap_limit: ${DIND_MEMSWAP_LIMIT:-3g}
    # Die drei Eintraege sind NOTWENDIG, nicht Kosmetik — jeweils einzeln
    # getestet, alle drei zusammen laeuft es erst:
    #   seccomp=unconfined     Default-seccomp blockt unshare(CLONE_NEWUSER),
    #                          ohne das startet der rootless-Daemon gar nicht.
    #   systempaths=unconfined  Docker maskiert /proc o. a. im Container; der
    #                          /proc-Mount im nested userns schlaegt sonst fehl:
    #                          "operation not permitted".
    #   /dev/net/tun            rootlesskit legt ein tap-Device fuer
    #                          slirp4netns an, sonst: "open: No such file or
    #                          directory".
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # LEER = TLS aus. Wichtig: '--tls=false' als command-Argument wird vom
      # rootless-Entryppoint ignoriert, nur diese Env-Variable wirkt. Ohne sie
      # laeuft 2376 ueber HTTPS und 2375 gar nicht — DOCKER_HOST=2375 bremst.
      - DOCKER_TLS_CERTDIR=
    # KEIN command-Override: der rootless-Entryppoint setzt dockerd selbst
    # auf, inklusive 2375. Festes '--host=...' verletzt das (dann laeuft er auf
    # 2376 und 2375 bleibt zu).
    volumes:
      - code-remote-projects:/projects
      # ACHTUNG, der Mount-Pfad ist NICHT /var/lib/docker. Der rootless-Daemon
      # startet ohne --data-root und nutzt seinen Default fuer rootless:
      # $HOME/.local/share/docker = /home/rootless/.local/share/docker
      # (HOME=/home/rootless, uid 1000). Live verifiziert mit
      #   docker info --format '{{.DockerRootDir}}'
      # Ein Mount auf /var/lib/docker ist wirkungslos: das Volume bleibt leer,
      # und ALLE Images/Builds liegen im Writable-Layer des Containers — weg bei
      # jedem Recreate. Genau das passiert, wenn man hier /var/lib/docker
      # eintraegt (gemessen: 11,9 MB im Layer, 0 Byte im Volume).
      - dind-data-rootless:/home/rootless/.local/share/docker
    networks:
      - code-remote

    # ACHTUNG: "mem_limit"/"cpus" an den INNEREN Containern greifen nicht, weil
    # rootless ohne systemd im Container keine cgroups durchsetzen kann. Die
    # inneren Limits lassen sich also nicht einzeln setzen.
    #
    # ABER: die Limits hier AM dind-CONTAINER greifen fuer alles, was der Agent
    # in diesem Daemon startet. Die inneren Prozesse teilen sich denselben
    # cgroup wie der Daemon — live gemessen liegen beide in
    # /system.slice/docker-<dind-id>.scope. Verifiziert mit 1,8 GB tmpfs in
    # einem inneren Container bei mem_limit 600m auf dem DinD:
    #   memory.peak  629149696  (= exakt die Decke)
    #   oom_kill     1
    #
    # Der Haken: bei OOM waehlt der Kernel den GROESSTEN Prozess im cgroup, und
    # das ist der dind-Daemon, nicht der schuldige Build. Deshalb KEIN
    # gemeinsames Limit mit code-dev, sondern zwei getrennte — so stirbt ein
    # runaway Build nur code-remote-dind (restart: unless-stopped) und die
    # code-dev-Session laeuft weiter.

  # Gleicher Sidecar-Code wie stack/docker-compose.yml (code-auth), aber als eigene
  # Instanz NUR in code-remote -> kein webnet -> kein Prod-Sichtkontakt.
  code-auth-remote:
    image: python:3.12-slim
    container_name: code-auth-remote
    restart: unless-stopped
    networks:
      - code-remote
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_HASH=${AUTH_HASH}
      - AUTH_SECRET=${AUTH_SECRET}
      - SESSION_TTL=${SESSION_TTL:-43200}
      - AUTH_PORT=8081
    command:
      - sh
      - -c
      - |
        mkdir -p /app
        cat > /app/auth.py << "PYEOF"
        """code-auth-remote: Single-User Cookie-Gate fuer Caddy forward_auth. Nur Stdlib + optional bcrypt.

        Env: AUTH_USER, AUTH_HASH (bcrypt $$2a$$/$$2b$$ ODER pbkdf2$$iter$$salt$$hex), AUTH_SECRET, SESSION_TTL.
        Routen:
          GET  /check      -> 200/401 (Caddy forward_auth, uri /check)
          GET  /api/me     -> 200 {"user":...} / 401 (Browser: schon eingeloggt?)
          POST /login      -> JSON oder Form, setzt Cookie, 200/401
          POST /api/login  -> dito (Caddy routet /api/login hierher)
          POST /logout, /api/logout -> Cookie loeschen
        Cookie: auth=user:exp:sig, sig=HMAC_SHA256(AUTH_SECRET, "user:exp"), HttpOnly, Secure, SameSite=Lax, Path /.
        """

        import hashlib
        import hmac
        import json
        import os
        import subprocess
        import sys
        import time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.parse import parse_qs, urlsplit

        AUTH_USER = os.environ.get("AUTH_USER", "admin")
        AUTH_HASH = os.environ.get("AUTH_HASH", "")
        AUTH_SECRET = os.environ.get("AUTH_SECRET", "")
        SESSION_TTL = int(os.environ.get("SESSION_TTL", "43200"))
        LISTEN_PORT = int(os.environ.get("AUTH_PORT", "8081"))

        _bcrypt = None


        def ensure_bcrypt():
            """bcrypt-Modul sicherstellen wenn ein caddy-Hash konfiguriert ist."""
            global _bcrypt
            if not AUTH_HASH.startswith("$$2"):
                return
            try:
                import bcrypt
                _bcrypt = bcrypt
                return
            except ImportError:
                pass
            print("bcrypt fehlt, installiere per pip...", flush=True)
            try:
                subprocess.run(["pip", "install", "--no-cache-dir", "bcrypt"],
                               check=True, capture_output=True, text=True, timeout=120)
                import bcrypt
                _bcrypt = bcrypt
                print("bcrypt installiert.", flush=True)
            except Exception as e:
                print(f"WARN: pip install bcrypt fehlgeschlagen ({e}) -> Auth-Service startet nicht.", flush=True)


        def verify_password(plain: str) -> bool:
            if not AUTH_HASH or not plain:
                return False
            if AUTH_HASH.startswith("$$2"):
                if _bcrypt is None:
                    print("FEHLER: bcrypt-Hash konfiguriert aber bcrypt-Modul fehlt "
                          "(pip-Install beim Start ist fehlgeschlagen).", flush=True)
                    return False
                try:
                    return _bcrypt.checkpw(plain.encode(), AUTH_HASH.encode())
                except Exception:
                    return False
            if AUTH_HASH.startswith("pbkdf2$$"):
                try:
                    _, it, salt_hex, hash_hex = AUTH_HASH.split("$$")
                    dk = hashlib.pbkdf2_hmac("sha256", plain.encode(),
                                             bytes.fromhex(salt_hex), int(it))
                    return hmac.compare_digest(dk.hex(), hash_hex)
                except Exception:
                    return False
            # Unbekanntes Hashformat: fail closed; kein Klartext-Fallback.
            return False


        def sign(user: str, exp: int) -> str:
            msg = f"{user}:{exp}".encode()
            return hmac.new(AUTH_SECRET.encode(), msg, hashlib.sha256).hexdigest()


        def make_cookie(user: str) -> str:
            exp = int(time.time()) + SESSION_TTL
            return f"{user}:{exp}:{sign(user, exp)}"


        def check_cookie(header: str | None) -> str | None:
            if not header:
                return None
            cookies = {}
            for part in header.split(";"):
                if "=" in part:
                    k, v = part.strip().split("=", 1)
                    cookies[k] = v
            val = cookies.get("auth")
            if not val:
                return None
            try:
                user, exp_s, sig = val.split(":")
            except ValueError:
                return None
            if user != AUTH_USER:
                return None
            try:
                if int(exp_s) < int(time.time()):
                    return None
            except ValueError:
                return None
            if not hmac.compare_digest(sign(user, int(exp_s)), sig):
                return None
            return user


        MAX_BODY_BYTES = 16 * 1024


        class AuthHTTPServer(ThreadingHTTPServer):
            allow_reuse_address = True
            daemon_threads = True

            def handle_error(self, request, client_address):
                exc = sys.exc_info()[1]
                if isinstance(exc, (BrokenPipeError, ConnectionResetError, ConnectionAbortedError, TimeoutError)):
                    return
                super().handle_error(request, client_address)


        class H(BaseHTTPRequestHandler):
            # Auth-Preflights sind kurz; HTTP/1.0 verhindert Idle-Auth-Sockets.
            protocol_version = "HTTP/1.0"
            server_version = "code-auth-remote/1.1"

            def setup(self):
                super().setup()
                self.connection.settimeout(10)

            def log_message(self, *a):
                pass

            def _write(self, body: bytes):
                try:
                    self.wfile.write(body)
                except (BrokenPipeError, ConnectionResetError, ConnectionAbortedError, TimeoutError):
                    self.close_connection = True

            def _send(self, code: int, body: bytes = b"", ctype: str = "text/plain"):
                try:
                    self.send_response(code)
                    self.send_header("Content-Type", ctype)
                    self.send_header("Content-Length", str(len(body)))
                    self.send_header("Cache-Control", "no-store")
                    self.end_headers()
                    if body:
                        self._write(body)
                except (BrokenPipeError, ConnectionResetError, ConnectionAbortedError, TimeoutError):
                    self.close_connection = True

            def _user(self):
                return check_cookie(self.headers.get("Cookie"))

            def do_GET(self):
                path = urlsplit(self.path).path
                if path in ("/check", "/api/me"):
                    user = self._user()
                    if user:
                        if path == "/api/me":
                            self._send(200, json.dumps({"user": user}).encode(), "application/json")
                        else:
                            self._send(200, b"OK")
                    else:
                        self._send(401, b"Unauthorized")
                elif path in ("/", "/health"):
                    self._send(200, b"code-auth-remote ok")
                else:
                    self._send(404, b"not found")

            def do_POST(self):
                path = urlsplit(self.path).path
                if path not in ("/login", "/api/login", "/logout", "/api/logout"):
                    self._send(404, b"not found")
                    return
                if path.endswith("logout"):
                    self.send_response(200)
                    self.send_header("Set-Cookie",
                                     "auth=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax")
                    self.send_header("Content-Length", "2")
                    self.end_headers()
                    self._write(b"OK")
                    return
                length_values = self.headers.get_all("Content-Length", [])
                if len(length_values) > 1:
                    self._send(400, b"invalid Content-Length")
                    return
                if not length_values:
                    length = 0
                else:
                    length_value = length_values[0]
                    if not length_value.isascii() or not length_value.isdecimal():
                        self._send(400, b"invalid Content-Length")
                        return
                    length = int(length_value)
                if length > MAX_BODY_BYTES:
                    self._send(413, b"request too large")
                    return
                raw = self.rfile.read(length) if length else b""
                ctype = self.headers.get("Content-Type", "")
                username, password = "", ""
                if "application/json" in ctype:
                    try:
                        data = json.loads(raw.decode() or "{}")
                        username = data.get("username", "")
                        password = data.get("password", "")
                    except Exception:
                        pass
                else:
                    form = parse_qs(raw.decode(errors="replace"))
                    username = form.get("username", [""])[0] or form.get("user", [""])[0]
                    password = form.get("password", [""])[0]
                # Single-User: leeres username-Feld = AUTH_USER (nur Passwort-Formular)
                if not username:
                    username = AUTH_USER
                if username == AUTH_USER and verify_password(password):
                    cookie = make_cookie(username)
                    body = json.dumps({"ok": True}).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.send_header("Cache-Control", "no-store")
                    self.send_header("Set-Cookie",
                                     f"auth={cookie}; Path=/; Max-Age={SESSION_TTL}; "
                                     f"HttpOnly; Secure; SameSite=Lax")
                    self.end_headers()
                    self._write(body)
                else:
                    time.sleep(0.5)  # minimales Rate-Limit gegen Brute-Force
                    self._send(401, json.dumps({"ok": False}).encode(), "application/json")


        if __name__ == "__main__":
            if not AUTH_SECRET:
                raise SystemExit("AUTH_SECRET fehlt")
            if not AUTH_HASH:
                raise SystemExit("AUTH_HASH fehlt (siehe README: caddy hash-password)")
            ensure_bcrypt()
            if not (AUTH_HASH.startswith("$$2") or AUTH_HASH.startswith("pbkdf2$$")):
                raise SystemExit("AUTH_HASH-Format unsupported (bcrypt oder pbkdf2 erforderlich)")
            if AUTH_HASH.startswith("$$2") and _bcrypt is None:
                raise SystemExit("bcrypt-Modul nicht verfuegbar")
            fmt = "bcrypt" if AUTH_HASH.startswith("$$2") else "pbkdf2"
            print(f"Hash-Format: {fmt}, bcrypt-Modul: {'ok' if _bcrypt else 'n/a'}", flush=True)
            print(f"AUTH_HASH-Laenge: {len(AUTH_HASH)} Zeichen (bcrypt=60, pbkdf2>100)", flush=True)
            print(f"code-auth-remote lauscht auf :{LISTEN_PORT} als {AUTH_USER}", flush=True)
            AuthHTTPServer(("0.0.0.0", LISTEN_PORT), H).serve_forever()
        PYEOF
        exec python3 /app/auth.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  code-remote:
    external: true

volumes:
  code-remote-projects:
  gh-config:
  gh-ssh:
  opencode-data:
  opencode-config:
  opencode-state:
  # Eigenes Volume fuer den rootless-Daemon (2026-09-26). Das alte
  # 'dind-data' war root:root (0:0) und ist fuer rootless unbrauchbar:
  # der Daemon laeuft als uid 1000 und kann dort nicht schreiben. Ein
  # eigenes Volume macht den Wechsel rueckgaengig — das alte bleibt
  # unangetastet und kann wieder eingehängt werden.
  dind-data-rootless:
