# Portainer-Stack: code-remote — ZWEITER Weg neben Mac-Tunnel (CODE_DOMAIN bleibt).
# Deploy: Portainer -> Stacks -> Add stack `code-remote` -> Web editor -> diese Datei pasten.
# Isolation: code-dev + dind + code-auth-remote haengen NUR in `code-remote`.
# KEIN webnet hier -> kein Zugriff auf Prod-Container per Name. Internet geht via NAT.
# Caddy braucht zusaetzlich das Netz `code-remote` (siehe remote/README.md, caddyfile-Repo).
#
# Env in Portainer (oder Stack-Env):
#   OPENCODE_PASSWORD   Pflicht (Serverpasswort, Caddy injiziert es upstream, Browser sieht es nie)
#   OPENCODE_AUTOUPDATE   default true: holt beim Containerstart das neueste
#                         opencode-Binary (V2 releast teils mehrmals taeglich);
#                         mit false deaktivieren (Image-Stand + CI-Updates only)
#   OPENCODE_UPDATE_INTERVAL default 1200: Watcher-Pruefintervall in Sekunden
#                         (1200 = 3x/Stunde, 1800 = 2x/Stunde, Minimum 300)
#   OPENCODE_UPDATE_HOURS default 5-21: Tagesfenster in Containerzeit (UTC,
#                         5-21 UTC ~= 06-22 MEZ Wien); "" = rund um die Uhr
#   OPENCODE_UPDATE_RESTART default idle: Container-Neustart bei Update nur
#                         wenn keine Session aktiv ist (busy → vertagt);
#                         mit always immer neustarten (kann Runs abbrechen)
#   AUTH_USER           default admin
#   AUTH_HASH           Pflicht (bcrypt $2a$... 60 Zeichen ODER pbkdf2$... vom setup.sh)
#   AUTH_SECRET         Pflicht (64 Hex, openssl rand -hex 32)
#   SESSION_TTL         default 43200
#   IMAGE               default ghcr.io/reisi007/opencode-web-dev-baseline:latest
#   CPU_CORES           default 3: maximale CPU-Kerne fuer code-dev
#   MEMORY_LIMIT        default 4g: RAM-Limit fuer code-dev (z. B. 2g, 8g)
#
# Erster Login danach: docker exec -it code-dev gh auth login
# (gespeichert in Volume gh-config -> ueberlebt Image-Upgrades)
services:
  code-dev:
    image: ${IMAGE:-ghcr.io/reisi007/opencode-web-dev-baseline:latest}
    container_name: code-dev
    restart: unless-stopped
    cpus: ${CPU_CORES:-3}
    mem_limit: ${MEMORY_LIMIT:-4g}
    environment:
      # Beide Namen gleich setzen: OPENCODE_PASSWORD ist der aktuelle Name,
      # OPENCODE_SERVER_PASSWORD wird von entrypoint/aelteren Releases erwartet.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_AUTOUPDATE=${OPENCODE_AUTOUPDATE:-true}
      - OPENCODE_UPDATE_INTERVAL=${OPENCODE_UPDATE_INTERVAL:-1200}
      - OPENCODE_UPDATE_HOURS=${OPENCODE_UPDATE_HOURS:-5-21}
      - OPENCODE_UPDATE_RESTART=${OPENCODE_UPDATE_RESTART:-idle}
      - DOCKER_HOST=tcp://dind:2375
      - PORT=8080
    volumes:
      - code-remote-projects:/projects
      - gh-config:/home/dev/.config/gh
      - gh-ssh:/home/dev/.ssh
      - opencode-data:/home/dev/.local/share/opencode
      - opencode-config:/home/dev/.config/opencode
      - opencode-state:/home/dev/.local/state/opencode
    networks:
      - code-remote
    depends_on:
      dind:
        condition: service_started
      code-auth-remote:
        condition: service_started

  # Isolierter Docker-Daemon NUR fuer code-dev (eigener Image-Cache, sieht Host/Prod nicht).
  dind:
    image: docker:29-dind
    container_name: code-remote-dind
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    volumes:
      - code-remote-projects:/projects
      - dind-data:/var/lib/docker
    networks:
      - code-remote

  # Gleicher Sidecar-Code wie stack/docker-compose.yml (code-auth), aber als eigene
  # Instanz NUR in code-remote -> kein webnet -> kein Prod-Sichtkontakt.
  code-auth-remote:
    image: python:3.12-slim
    container_name: code-auth-remote
    restart: unless-stopped
    networks:
      - code-remote
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_HASH=${AUTH_HASH}
      - AUTH_SECRET=${AUTH_SECRET}
      - SESSION_TTL=${SESSION_TTL:-43200}
      - AUTH_PORT=8081
    command:
      - sh
      - -c
      - |
        mkdir -p /app
        cat > /app/auth.py << "PYEOF"
        """code-auth-remote: Single-User Cookie-Gate fuer Caddy forward_auth. Nur Stdlib + optional bcrypt.

        Env: AUTH_USER, AUTH_HASH (bcrypt $$2a$$/$$2b$$ ODER pbkdf2$$iter$$salt$$hex), AUTH_SECRET, SESSION_TTL.
        Routen:
          GET  /check      -> 200/401 (Caddy forward_auth, uri /check)
          GET  /api/me     -> 200 {"user":...} / 401 (Browser: schon eingeloggt?)
          POST /login      -> JSON oder Form, setzt Cookie, 200/401
          POST /api/login  -> dito (Caddy routet /api/login hierher)
          POST /logout, /api/logout -> Cookie loeschen
        Cookie: auth=user:exp:sig, sig=HMAC_SHA256(AUTH_SECRET, "user:exp"), HttpOnly, Secure, SameSite=Lax, Path /.
        """

        import hashlib
        import hmac
        import json
        import os
        import subprocess
        import sys
        import time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.parse import parse_qs, urlsplit

        AUTH_USER = os.environ.get("AUTH_USER", "admin")
        AUTH_HASH = os.environ.get("AUTH_HASH", "")
        AUTH_SECRET = os.environ.get("AUTH_SECRET", "")
        SESSION_TTL = int(os.environ.get("SESSION_TTL", "43200"))
        LISTEN_PORT = int(os.environ.get("AUTH_PORT", "8081"))

        _bcrypt = None


        def ensure_bcrypt():
            """bcrypt-Modul sicherstellen wenn ein caddy-Hash konfiguriert ist."""
            global _bcrypt
            if not AUTH_HASH.startswith("$$2"):
                return
            try:
                import bcrypt
                _bcrypt = bcrypt
                return
            except ImportError:
                pass
            print("bcrypt fehlt, installiere per pip...", flush=True)
            try:
                subprocess.run(["pip", "install", "--no-cache-dir", "bcrypt"],
                               check=True, capture_output=True, text=True, timeout=120)
                import bcrypt
                _bcrypt = bcrypt
                print("bcrypt installiert.", flush=True)
            except Exception as e:
                print(f"WARN: pip install bcrypt fehlgeschlagen ({e}) -> Auth-Service startet nicht.", flush=True)


        def verify_password(plain: str) -> bool:
            if not AUTH_HASH or not plain:
                return False
            if AUTH_HASH.startswith("$$2"):
                if _bcrypt is None:
                    print("FEHLER: bcrypt-Hash konfiguriert aber bcrypt-Modul fehlt "
                          "(pip-Install beim Start ist fehlgeschlagen).", flush=True)
                    return False
                try:
                    return _bcrypt.checkpw(plain.encode(), AUTH_HASH.encode())
                except Exception:
                    return False
            if AUTH_HASH.startswith("pbkdf2$$"):
                try:
                    _, it, salt_hex, hash_hex = AUTH_HASH.split("$$")
                    dk = hashlib.pbkdf2_hmac("sha256", plain.encode(),
                                             bytes.fromhex(salt_hex), int(it))
                    return hmac.compare_digest(dk.hex(), hash_hex)
                except Exception:
                    return False
            # Unbekanntes Hashformat: fail closed; kein Klartext-Fallback.
            return False


        def sign(user: str, exp: int) -> str:
            msg = f"{user}:{exp}".encode()
            return hmac.new(AUTH_SECRET.encode(), msg, hashlib.sha256).hexdigest()


        def make_cookie(user: str) -> str:
            exp = int(time.time()) + SESSION_TTL
            return f"{user}:{exp}:{sign(user, exp)}"


        def check_cookie(header: str | None) -> str | None:
            if not header:
                return None
            cookies = {}
            for part in header.split(";"):
                if "=" in part:
                    k, v = part.strip().split("=", 1)
                    cookies[k] = v
            val = cookies.get("auth")
            if not val:
                return None
            try:
                user, exp_s, sig = val.split(":")
            except ValueError:
                return None
            if user != AUTH_USER:
                return None
            try:
                if int(exp_s) < int(time.time()):
                    return None
            except ValueError:
                return None
            if not hmac.compare_digest(sign(user, int(exp_s)), sig):
                return None
            return user


        MAX_BODY_BYTES = 16 * 1024


        class AuthHTTPServer(ThreadingHTTPServer):
            allow_reuse_address = True
            daemon_threads = True

            def handle_error(self, request, client_address):
                exc = sys.exc_info()[1]
                if isinstance(exc, (BrokenPipeError, ConnectionResetError, ConnectionAbortedError, TimeoutError)):
                    return
                super().handle_error(request, client_address)


        class H(BaseHTTPRequestHandler):
            # Auth-Preflights sind kurz; HTTP/1.0 verhindert Idle-Auth-Sockets.
            protocol_version = "HTTP/1.0"
            server_version = "code-auth-remote/1.1"

            def setup(self):
                super().setup()
                self.connection.settimeout(10)

            def log_message(self, *a):
                pass

            def _write(self, body: bytes):
                try:
                    self.wfile.write(body)
                except (BrokenPipeError, ConnectionResetError, ConnectionAbortedError, TimeoutError):
                    self.close_connection = True

            def _send(self, code: int, body: bytes = b"", ctype: str = "text/plain"):
                try:
                    self.send_response(code)
                    self.send_header("Content-Type", ctype)
                    self.send_header("Content-Length", str(len(body)))
                    self.send_header("Cache-Control", "no-store")
                    self.end_headers()
                    if body:
                        self._write(body)
                except (BrokenPipeError, ConnectionResetError, ConnectionAbortedError, TimeoutError):
                    self.close_connection = True

            def _user(self):
                return check_cookie(self.headers.get("Cookie"))

            def do_GET(self):
                path = urlsplit(self.path).path
                if path in ("/check", "/api/me"):
                    user = self._user()
                    if user:
                        if path == "/api/me":
                            self._send(200, json.dumps({"user": user}).encode(), "application/json")
                        else:
                            self._send(200, b"OK")
                    else:
                        self._send(401, b"Unauthorized")
                elif path in ("/", "/health"):
                    self._send(200, b"code-auth-remote ok")
                else:
                    self._send(404, b"not found")

            def do_POST(self):
                path = urlsplit(self.path).path
                if path not in ("/login", "/api/login", "/logout", "/api/logout"):
                    self._send(404, b"not found")
                    return
                if path.endswith("logout"):
                    self.send_response(200)
                    self.send_header("Set-Cookie",
                                     "auth=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax")
                    self.send_header("Content-Length", "2")
                    self.end_headers()
                    self._write(b"OK")
                    return
                length = int(self.headers.get("Content-Length", "0") or 0)
                if length > MAX_BODY_BYTES:
                    self._send(413, b"request too large")
                    return
                raw = self.rfile.read(length) if length else b""
                ctype = self.headers.get("Content-Type", "")
                username, password = "", ""
                if "application/json" in ctype:
                    try:
                        data = json.loads(raw.decode() or "{}")
                        username = data.get("username", "")
                        password = data.get("password", "")
                    except Exception:
                        pass
                else:
                    form = parse_qs(raw.decode(errors="replace"))
                    username = form.get("username", [""])[0] or form.get("user", [""])[0]
                    password = form.get("password", [""])[0]
                # Single-User: leeres username-Feld = AUTH_USER (nur Passwort-Formular)
                if not username:
                    username = AUTH_USER
                if username == AUTH_USER and verify_password(password):
                    cookie = make_cookie(username)
                    body = json.dumps({"ok": True}).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.send_header("Cache-Control", "no-store")
                    self.send_header("Set-Cookie",
                                     f"auth={cookie}; Path=/; Max-Age={SESSION_TTL}; "
                                     f"HttpOnly; Secure; SameSite=Lax")
                    self.end_headers()
                    self._write(body)
                else:
                    time.sleep(0.5)  # minimales Rate-Limit gegen Brute-Force
                    self._send(401, json.dumps({"ok": False}).encode(), "application/json")


        if __name__ == "__main__":
            if not AUTH_SECRET:
                raise SystemExit("AUTH_SECRET fehlt")
            if not AUTH_HASH:
                raise SystemExit("AUTH_HASH fehlt (siehe README: caddy hash-password)")
            ensure_bcrypt()
            if not (AUTH_HASH.startswith("$$2") or AUTH_HASH.startswith("pbkdf2$$")):
                raise SystemExit("AUTH_HASH-Format unsupported (bcrypt oder pbkdf2 erforderlich)")
            if AUTH_HASH.startswith("$$2") and _bcrypt is None:
                raise SystemExit("bcrypt-Modul nicht verfuegbar")
            fmt = "bcrypt" if AUTH_HASH.startswith("$$2") else "pbkdf2"
            print(f"Hash-Format: {fmt}, bcrypt-Modul: {'ok' if _bcrypt else 'n/a'}", flush=True)
            print(f"AUTH_HASH-Laenge: {len(AUTH_HASH)} Zeichen (bcrypt=60, pbkdf2>100)", flush=True)
            print(f"code-auth-remote lauscht auf :{LISTEN_PORT} als {AUTH_USER}", flush=True)
            AuthHTTPServer(("0.0.0.0", LISTEN_PORT), H).serve_forever()
        PYEOF
        exec python3 /app/auth.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  code-remote:
    external: true

volumes:
  code-remote-projects:
  gh-config:
  gh-ssh:
  opencode-data:
  opencode-config:
  opencode-state:
  dind-data:
